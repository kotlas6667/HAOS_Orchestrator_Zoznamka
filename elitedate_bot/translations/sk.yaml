configuration:
  log_level:
    name: Úroveň logu
    description: >-
      Podrobnosť logov add-onu. Pre bežnú prevádzku nechaj info.
      Zapni debug len pri ladení problémov.
  elitedate_email:
    name: E-mail (Elite Date)
    description: >-
      Prihlasovací e-mail na elitedate.sk. Vyplň v Nastaveniach add-onu —
      nemusíš ručne editovať /data/.env.
  elitedate_password:
    name: Heslo (Elite Date)
    description: >-
      Prihlasovacie heslo. Uložené v /data/.env na zariadení.
      Po zmene hesla ulož Nastavenia a reštartuj add-on.
  orchestrator_url:
    name: URL orchestrátora
    description: >-
      Info orchestrátora → Hostname (napr. http://03146090-haos-orchestrator:8000).
      Hash prefix závisí od URL tvojho Obchodu — nie vždy 8c003d88. Nie haos_orchestrator.
  elitedate_login_url:
    name: Login URL
    description: >-
      Adresa prihlasovacej stránky Elite Date. Default https://www.elitedate.sk/prihlaseni
  headless:
    name: Headless režim
    description: >-
      ZAPNUTÉ (true) — Chromium beží na pozadí bez okna (bežná prevádzka).
      VYPNUTÉ (false) — len pri ladení s pripojeným displejom / VNC.
  poll_enabled:
    name: Automatické sledovanie správ
    description: >-
      ZAPNUTÉ — bot pravidelne (cca 90–180 s) kontroluje nové Elite Date správy
      a posiela ich orchestrátoru na Discord. VYPNUTÉ — nevyhľadáva inbox
      (vhodné keď chceš ísť na web); Discord odpovede (/send) stále fungujú.
      Pri silnom konflikte session web+bot aj tak zastav celý add-on.

network:
  8600/tcp: HTTP API bota — /health, odoslanie odpovedí z Discordu
