configuration:
  log_level:
    name: Úroveň logu
    description: >-
      Podrobnosť logov add-onu. Pre bežnú prevádzku nechaj info.
      Zapni debug len pri ladení problémov.
  openai_api_key:
    name: OpenAI API kľúč
    description: >-
      Kľúč z platform.openai.com — potrebný pre GPT routing a chat.
      Vyplň v Nastaveniach, nemusíš ručne editovať .env.
  openai_model:
    name: OpenAI model (routing + chat)
    description: >-
      Lacný model pre routing nástrojov a bežný chat. Default gpt-4o-mini.
  dating_reply_model:
    name: Model pre AI návrhy (ED + Tinder + Badoo)
    description: >-
      OpenAI model pre 4 návrhy odpovedí v Discorde. Default gpt-4.1 (silnejší ako gpt-4o).
      Používa sa keď je provider openai. Routing ostáva na poli vyššie.
  dating_reply_provider:
    name: Provider AI návrhov (dating)
    description: >-
      openai = GPT (default). gemini = Google Gemini pre Badoo návrhy a prepis audia.
      V Discorde môžeš prepnúť aj ručne: reply `6 gemini` alebo `6 gpt`.
  gemini_api_key:
    name: Gemini API kľúč
    description: >-
      Kľúč z Google AI Studio. Potrebný pre Gemini návrhy a prepis Badoo audio správ.
  dating_reply_gemini_model:
    name: Gemini model (dating návrhy + audio)
    description: >-
      Default gemini-2.5-flash. Používa sa pri provider=gemini alebo pri prepise audia.
  ha_url:
    name: URL Home Assistant
    description: >-
      Adresa Home Assistant API. V HAOS add-one štandardne
      http://supervisor/core:8123
  ha_token:
    name: HA long-lived token
    description: >-
      Long-lived access token z HA profilu. Potrebný pre ovládanie zariadení.
  weather_default_city:
    name: Predvolené mesto (počasie)
    description: >-
      Mesto pre počasie, keď v príkaze nie je uvedené iné.
  openweather_api_key:
    name: OpenWeather API kľúč
    description: >-
      Voliteľné — pre reálne počasie namiesto mock režimu.
      Bez kľúča funguje mock provider.
  discord_bot_enabled:
    name: Discord bot zapnutý
    description: >-
      ZAPNUTÉ — orchestrátor počúva Discord kanál (potrebuje token nižšie).
      VYPNUTÉ — Discord bot sa nespustí.
  discord_bot_token:
    name: Discord bot token
    description: >-
      Token bota z Discord Developer Portal. Zapni Message Content Intent.
  discord_webhook_url:
    name: Discord webhook URL
    description: >-
      Voliteľné — pre notifikácie cez webhook (ráno, emaily, ED/Tinder návrhy).
  discord_bot_channel_id:
    name: Discord kanál ID
    description: >-
      ID kanála kde bot počúva (voliteľné — prázdne = všetky kanály).
  elitedate_bot_url:
    name: URL Elite Date bota
    description: >-
      Adresa samostatného HAOS Elite Date Bot add-onu.
      Info add-onu → Hostname, napr. http://XXXXXXX-haos-elitedate:8600 (hash je z tvojho Obchodu, nie vždy 8c003d88). Nie haos_elitedate.
  tinder_bot_url:
    name: URL Tinder bota
    description: >-
      Info add-onu → Hostname, napr. http://XXXXXXX-haos-tinder:8601. Nie haos_tinder ani local-haos-*.
  badoo_bot_url:
    name: URL Badoo bota
    description: >-
      Info add-onu → Hostname, napr. http://XXXXXXX-haos-badoo:8602. Nie haos_badoo ani local-haos-*.
  elitedate_auto_send:
    name: Elite Date — auto odoslať
    description: >-
      ZAPNUTÉ — vybraná odpoveď sa aj odošle. VYPNUTÉ — len vloží do poľa.
  tinder_auto_send:
    name: Tinder — auto odoslať
    description: >-
      ZAPNUTÉ — vybraná odpoveď sa aj odošle. VYPNUTÉ — len vloží do poľa.
      Rovnaký prepínač je aj v Nastaveniach Tinder bota (Auto odoslať odpoveď).
  badoo_auto_send:
    name: Badoo — auto odoslať
    description: >-
      ZAPNUTÉ — vybraná odpoveď sa aj odošle. VYPNUTÉ — len vloží do poľa.
      Rovnaký prepínač je aj v Nastaveniach Badoo bota (Auto odoslať odpoveď).
  dating_reply_skill:
    name: Skill pre AI návrhy (voliteľné jednoriadkové)
    description: >-
      HA pole je jednoriadkové — na dlhý skill použi veľký editor na webe
      Orchestrátora (panel / ingress) → „Skill pre AI návrhy (ED + Tinder + Badoo)“.
      Ak sem niečo vložíš, pri štarte sa skopíruje do súboru (prepíše dashboard).
      Prázdne = ponechá uložený skill z dashboardu / vstavaný default.
  google_accounts_enabled:
    name: Google VNC prihlásenie (Gmail + Kalendár)
    description: >-
      ZAPNUTÉ — spustí noVNC na porte **6082** (Tinder 6080, Badoo 6081). Uložiť → Reštart,
      otvor http://<IP_HA>:6082/vnc.html, na dashboarde klikni „Prihlásiť cez VNC“.
      V Chromiu sa prihlás na Google — stiahnu sa tokeny na maily aj kalendár.
      Viac Gmail účtov = zopakuj prihlásenie. Potrebný Desktop OAuth JSON
      (gmailSecret.json) v /data/orchestrator/config/.
      VYPNUTÉ + Reštart — noVNC sa vypne; už pripojené účty ostanú.

network:
  8000/tcp: Orchestrátor API, web dashboard a ingress
  6082/tcp: noVNC — Google login (len keď je zapnutý switch Google VNC)
